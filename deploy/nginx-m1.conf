# nginx site for M1 → /etc/nginx/sites-available/m1  (then symlink into sites-enabled)
# Replace m1.example.com with the real domain. Certbot adds the HTTPS server block:
#   sudo certbot --nginx -d m1.example.com -d www.m1.example.com
server {
    listen 80;
    listen [::]:80;
    server_name m1.example.com www.m1.example.com;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # hashed build files: cache forever
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
